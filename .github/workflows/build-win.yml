name: Build Flutter for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clone repo from GitLab
        run: git clone --depth 1 https://gitlab.com/gnejusz_pompejusz/tomos.git tomos

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get
        working-directory: tomos

      - name: Run code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: tomos

      - name: Build Windows Release
        run: flutter build windows --release --verbose
        working-directory: tomos

      - name: Archive Release
        run: Compress-Archive -Path tomos/build/windows/x64/runner/Release/* -DestinationPath tomos-windows-release.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomos-windows
          path: tomos-windows-release.zip