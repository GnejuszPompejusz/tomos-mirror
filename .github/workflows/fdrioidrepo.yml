name: Build & Publish F-Droid Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versionName:
        description: "Nazwa wersji aplikacji (SemVer bez prefiksu 'v', np. 0.3.0 lub 1.2.4)"
        required: true
        type: string
      versionCode:
        description: "Kod wersji Androida (liczba całkowita większa niż w poprzednim wydaniu, np. 15)"
        required: true
        type: string
      flutterVersion:
        description: "Wersja lub kanał Fluttera: wpisz kanał ('stable', 'beta', 'master') LUB numer wersji (np. '3.24.5', '3.27.1', '3.24.x')"
        required: false
        default: "stable"
        type: string

jobs:
  fdroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      APPID: dev.gnejusz.tomos
      GITLAB_URL: "https://gitlab.com/gnejusz_pompejusz/tomos.git"
      # Obsługuje zarówno nazwy kanałów ('stable', 'beta'), jak i numery wersji ('3.24.5', '3.24.x')
      FLUTTER_VERSION: ${{ inputs.flutterVersion || 'stable' }}

    steps:
      - name: Checkout Hosting Repo (GitHub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Add Android SDK build-tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

      - name: Install fdroidserver via pipx
        run: |
          pipx install fdroidserver
          sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Clone Source & Resolve Version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.versionName }}
          INPUT_VERSION_CODE: ${{ inputs.versionCode }}
        run: |
          BRANCH_OR_TAG=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            BRANCH_OR_TAG="--branch ${{ github.ref_name }}"
          fi

          git clone --depth 1 $BRANCH_OR_TAG "$GITLAB_URL" source_code
          cd source_code
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CLEAN_VERSION_NAME="${INPUT_VERSION_NAME#v}"
            echo "VERSION_NAME=${CLEAN_VERSION_NAME}" >> "$GITHUB_ENV"
            echo "VERSION_CODE=${INPUT_VERSION_CODE}" >> "$GITHUB_ENV"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

            RAW_VERSION=$(grep -E '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
            if [[ "$RAW_VERSION" == *"+"* ]]; then
              VERSION_CODE="${RAW_VERSION#*+}"
            else
              VERSION_CODE="${{ github.run_number }}"
            fi
            echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          fi

      - name: Setup Signing
        env:
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          cd source_code
          echo "$KEYSTORE_B64" | base64 -d > release-key.p12

          printf '%s\n' \
            "KEYSTORE_PASSWORD=${KEYSTORE_PASS}" \
            "KEY_ALIAS=fdroid" \
            "KEYSTORE_PATH=${GITHUB_WORKSPACE}/source_code/release-key.p12" \
            > android/keystore.properties

          keytool -list -v -keystore release-key.p12 \
            -storepass "$KEYSTORE_PASS" -alias fdroid

      - name: Build Release APK
        run: |
          cd source_code
          flutter pub get

          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"

          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/apks/${APPID}_${VERSION_CODE}.apk"

      - name: Check APK signature
        run: |
          cd source_code
          apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Init F-Droid Structure
        env:
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          mkdir -p repo metadata
          # Ikona poza repo/icons/, aby F-Droid mógł ją samodzielnie przetworzyć
          cp source_code/assets/icons/icon.png repo-icon.png

          printf '%s\n' \
            'keystore: "keystore.p12"' \
            "keystorepass: \"${KEYSTORE_PASS}\"" \
            "keypass: \"${KEYSTORE_PASS}\"" \
            'keyalias: "fdroid"' \
            'repo_keyalias: "fdroid"' \
            'repo_icon: "repo-icon.png"' \
            'repo_url: "https://gnejuszpompejusz.github.io/tomos-mirror/repo"' \
            'repo_name: "Tomos Mirror"' \
            'repo_description: "Repozytorium aplikacji Tomos"' \
            > config.yml
          chmod 600 config.yml

      - name: Setup Repo Signing Key
        run: cp source_code/release-key.p12 keystore.p12

      - name: Update Metadata
        run: |
          APP_DIR="metadata/${APPID}"
          META_FILE="metadata/${APPID}.yml"
          mkdir -p "$APP_DIR/en-US/images"

          # 1. Kopiowanie metadanych aplikacji
          cp "fdroid/metadata/${APPID}.yml" "$META_FILE"

          # 2. Ikona aplikacji do metadanych Fastlane
          cp source_code/assets/icons/icon.png "$APP_DIR/en-US/images/icon.png"

          # 3. Kopiowanie tekstów Fastlane (jeśli istnieją w repozytorium)
          if [ -d "fdroid/metadata/${APPID}/en-US" ]; then
            cp -r "fdroid/metadata/${APPID}/en-US/"* "$APP_DIR/en-US/"
          fi

          # 4. Aktualizacja numeru i kodu wersji
          sed -i "s/^CurrentVersion:.*/CurrentVersion: ${VERSION_NAME}/" "$META_FILE"
          sed -i "s/^CurrentVersionCode:.*/CurrentVersionCode: ${VERSION_CODE}/" "$META_FILE"

      - name: Update F-Droid Index
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          cp apks/*.apk repo/
          fdroid update --pretty --verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          destination_dir: repo
          keep_files: false
          force_orphan: true
