name: Build & Publish F-Droid Repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      versionName:
        description: "App version name (np. 0.3.0)"
        required: true
      versionCode:
        description: "Android versionCode (np. 15)"
        required: true
      flutterVersion:
        description: "Flutter channel / version"
        required: false
        default: "stable"

jobs:
  fdroid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      APPID: dev.gnejusz.tomos
      GITLAB_URL: "https://gitlab.com/gnejusz_pompejusz/tomos.git"
      FLUTTER_VERSION: ${{ github.event.inputs.flutterVersion || 'stable' }}

    steps:
      - name: Checkout Hosting Repo (GitHub)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Add Android SDK build-tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

      - name: Install fdroidserver via pipx
        run: |
          pipx install fdroidserver
          sudo apt-get update && sudo apt-get install -y libglu1-mesa

      - name: Clone Source & Resolve Version
        id: version
        run: |
          BRANCH_OR_TAG=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            BRANCH_OR_TAG="--branch ${{ github.ref_name }}"
          fi

          git clone --depth 1 $BRANCH_OR_TAG ${{ env.GITLAB_URL }} source_code
          cd source_code
          echo "COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION_NAME=${{ github.event.inputs.versionName }}" >> $GITHUB_ENV
            echo "VERSION_CODE=${{ github.event.inputs.versionCode }}" >> $GITHUB_ENV
          else
            TAG=${GITHUB_REF#refs/tags/}
            echo "VERSION_NAME=${TAG#v}" >> $GITHUB_ENV
            VERSION_CODE=$(grep "version:" pubspec.yaml | head -1 | sed 's/.*+//' || echo "${{ github.run_number }}")
            echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          fi

      - name: Setup Signing
        run: |
          cd source_code
          cat > android/keystore.properties <<EOF
          KEYSTORE_PASSWORD=${{ secrets.FDROID_KEYSTORE_PASS }}
          KEY_ALIAS=fdroid
          KEYSTORE_PATH=../../release-key.p12
          EOF

          echo "${{ secrets.FDROID_KEYSTORE_BASE64 }}" | base64 -d > release-key.p12

          keytool -list -v -keystore release-key.p12 \
            -storepass "${{ secrets.FDROID_KEYSTORE_PASS }}" -alias fdroid

      - name: Build Release APK
        run: |
          cd source_code
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release

          mkdir -p $GITHUB_WORKSPACE/apks
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/apks/${{ env.APPID }}_${{ env.VERSION_CODE }}.apk

      - name: Check APK signature
        run: |
          cd source_code
          apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Init F-Droid Structure
        run: |
          mkdir -p repo metadata
          # Zapisujemy ikonę poza repo/icons/, aby F-Droid mógł ją sam skopiować
          cp source_code/assets/icons/icon.png repo-icon.png

          cat > config.yml <<EOF
          keystore: "keystore.p12"
          keystorepass: "${{ secrets.FDROID_KEYSTORE_PASS }}"
          keypass: "${{ secrets.FDROID_KEYSTORE_PASS }}"
          keyalias: "fdroid"
          repo_keyalias: "fdroid"
          repo_icon: "repo-icon.png"
          repo_url: "https://gnejuszpompejusz.github.io/tomos-mirror/repo"
          repo_name: "Tomos Mirror"
          repo_description: "Repozytorium aplikacji Tomos"
          EOF
          chmod 600 config.yml

      - name: Setup Repo Signing Key
        run: cp source_code/release-key.p12 keystore.p12

      - name: Update Metadata
        run: |
          APP_DIR="metadata/${{ env.APPID }}"
          mkdir -p $APP_DIR/en-US/images

          # 1. Kopiowanie metadanych aplikacji
          cp fdroid/metadata/${{ env.APPID }}.yml metadata/${{ env.APPID }}.yml

          # 2. Ikona aplikacji do metadanych Fastlane
          cp source_code/assets/icons/icon.png $APP_DIR/en-US/images/icon.png

          # 3. Kopiowanie tekstów Fastlane (jeśli istnieją w repozytorium)
          if [ -d "fdroid/metadata/${{ env.APPID }}/en-US" ]; then
            cp -r fdroid/metadata/${{ env.APPID }}/en-US/* $APP_DIR/en-US/
          fi

          # 4. Aktualizacja numeru i kodu wersji
          sed -i "s/CurrentVersion:.*/CurrentVersion: ${{ env.VERSION_NAME }}/" metadata/${{ env.APPID }}.yml
          sed -i "s/CurrentVersionCode:.*/CurrentVersionCode: ${{ env.VERSION_CODE }}/" metadata/${{ env.APPID }}.yml

      - name: Update F-Droid Index
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          cp apks/*.apk repo/
          fdroid update --pretty --verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          destination_dir: repo
          keep_files: false
          force_orphan: true
